name: Bug report
description: Report a reproducible defect without attaching sensitive field data
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not upload device credentials, private protocols, customer data, or unredacted field captures.
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: v1.0.0 or commit SHA
    validations:
      required: true
  - type: dropdown
    id: module
    attributes:
      label: Module
      options:
        - Metal-ball calibration
        - Solar calibration
        - Device adapter
        - Demo/build
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      description: Use synthetic or fully anonymized data only.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true

